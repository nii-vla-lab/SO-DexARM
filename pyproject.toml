[build-system]
requires = ["setuptools>=71.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sodexarm"
version = "0.1.0"
description = "SO-DexARM hardware and Quest teleoperation extensions for Hugging Face LeRobot"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "NII VLA Lab" }]
keywords = ["lerobot", "robotics", "teleoperation", "so101", "amazinghand"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lerobot[feetech,intelrealsense,smolvla]==0.4.4",
    "PyYAML>=6.0,<7.0",
    "scipy>=1.10.1,<1.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1,<9.0",
    "ruff>=0.9,<1.0",
]

[project.urls]
Homepage = "https://github.com/nii-vla-lab/SO-DexARM"
Repository = "https://github.com/nii-vla-lab/SO-DexARM"
Issues = "https://github.com/nii-vla-lab/SO-DexARM/issues"

[project.scripts]
sodexarm = "sodexarm.cli.main:main"
lerobot-so-dexarm = "sodexarm.cli.main:main"
sodexarm-calibrate = "sodexarm.control.calibrate:main"
sodexarm-teleoperate = "sodexarm.control.teleoperate:main"
sodexarm-record = "sodexarm.control.record:main"
sodexarm-train = "sodexarm.control.train:main"
sodexarm-eval = "sodexarm.control.eval:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sodexarm*"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["sodexarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
